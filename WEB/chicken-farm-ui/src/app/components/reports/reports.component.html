<div class="grid grid-cols-12 gap-4">
  <!-- Farm Report -->
  <div class="col-span-12 md:col-span-6">
    <div class="bg-white rounded-xl border border-stone-200 p-4 shadow-sm">
      <h2 class="font-bold text-stone-800 mb-4">Farm Report</h2>

      @if (loading) {
        <p class="text-stone-500">Loading...</p>
      } @else if (dashboard) {
        <div class="space-y-2 mb-6">
          <p><span class="font-medium">Total birds:</span> {{ dashboard.totalBirds }}</p>
          <p><span class="font-medium">Eggs collected:</span> {{ dashboard.totalEggsCollected }}</p>
          <p><span class="font-medium">Egg revenue:</span> R{{ dashboard.totalEggRevenue | number:'1.2-2' }}</p>
          <p><span class="font-medium">Open orders:</span> {{ dashboard.openOrders }}</p>
        </div>

        <div class="flex gap-2">
          <button (click)="print()"
                  class="bg-green-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-green-700 transition-colors">
            Print / Save PDF
          </button>
          <button (click)="exportData()"
                  class="bg-stone-200 text-stone-700 font-medium py-2 px-4 rounded-lg hover:bg-stone-300 transition-colors">
            Export Data JSON
          </button>
        </div>
      }
    </div>
  </div>

  <!-- Import Backup -->
  <div class="col-span-12 md:col-span-6">
    <div class="bg-white rounded-xl border border-stone-200 p-4 shadow-sm">
      <h2 class="font-bold text-stone-800 mb-4">Import Backup</h2>

      <div class="space-y-3">
        <textarea rows="6" placeholder="Paste exported JSON here"
                  class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 font-mono text-sm"></textarea>

        <div class="flex gap-2">
          <button class="bg-green-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-green-700 transition-colors">
            Import
          </button>
          <button class="bg-red-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-red-700 transition-colors">
            Clear All Data
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
