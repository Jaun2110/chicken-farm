<div class="grid grid-cols-12 gap-4">
  <!-- Form -->
  <div class="col-span-12 md:col-span-4">
    <div class="bg-white rounded-xl border border-stone-200 p-4 shadow-sm">
      <h2 class="font-bold text-stone-800 mb-4">Paddock Rotation</h2>

      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Paddock / camp</label>
          <input [(ngModel)]="newPaddock.name" type="text" placeholder="Paddock A"
                 class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Date in</label>
          <input [(ngModel)]="newPaddock.dateIn" type="date"
                 class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Date out (optional)</label>
          <input [(ngModel)]="newPaddock.dateOut" type="date"
                 class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Soil / grass notes</label>
          <textarea [(ngModel)]="newPaddock.notes" rows="3" placeholder="Manure spread, grass height, bare soil, insects..."
                    class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
        </div>

        <button (click)="addPaddock()"
                class="w-full bg-green-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-green-700 transition-colors">
          Add Rotation
        </button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="col-span-12 md:col-span-8">
    <div class="bg-white rounded-xl border border-stone-200 p-4 shadow-sm">
      <h2 class="font-bold text-stone-800 mb-4">Rotation Log</h2>

      @if (loading) {
        <p class="text-stone-500">Loading...</p>
      } @else if (paddocks.length === 0) {
        <p class="text-stone-500">No paddock rotations recorded yet.</p>
      } @else {
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-stone-200">
                <th class="text-left py-2 px-3 font-medium text-stone-600">Paddock</th>
                <th class="text-left py-2 px-3 font-medium text-stone-600">In</th>
                <th class="text-left py-2 px-3 font-medium text-stone-600">Out</th>
                <th class="text-left py-2 px-3 font-medium text-stone-600">Rest days</th>
                <th class="text-left py-2 px-3 font-medium text-stone-600">Notes</th>
                <th class="text-left py-2 px-3 font-medium text-stone-600"></th>
              </tr>
            </thead>
            <tbody>
              @for (p of paddocks; track p.id) {
                <tr class="border-b border-stone-100">
                  <td class="py-2 px-3 font-medium text-stone-800">{{ p.name }}</td>
                  <td class="py-2 px-3 text-stone-700">{{ p.dateIn }}</td>
                  <td class="py-2 px-3 text-stone-700">{{ p.dateOut || '-' }}</td>
                  <td class="py-2 px-3 text-stone-700">{{ p.restDays }}</td>
                  <td class="py-2 px-3 text-stone-700 max-w-xs truncate">{{ p.notes }}</td>
                  <td class="py-2 px-3">
                    <button (click)="deletePaddock(p.id)"
                            class="bg-red-600 text-white text-xs px-2 py-1 rounded hover:bg-red-700">
                      Delete
                    </button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </div>
  </div>
</div>
